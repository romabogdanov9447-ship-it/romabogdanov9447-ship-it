<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1080, H = 1920;
// ---------------------------------------------------------------- palette
const C = {
  ink: 0x0a1018, teal: 0x12303f, yel: 0xffd21f, org: 0xff8a2a, grn: 0x39d98a, red: 0xff4848, paper: 0xeef1f5,

const CSS = { ink: '#0a1018', yel: '#ffd21f', org: '#ff8a2a', grn: '#39d98a', red: '#ff4848', paper: '#eef1f5', grey: '#8794a8', dim: '#3a4658', panel: '#152131', panel2: '#1e2e42' };

// ---------------------------------------------------------------- utils
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const pr = (t, a, d) => cl((t - a) / d);
const L = (a, b, k) => a + (b - a) * k;
const E = {
  out: t => 1 - Math.pow(1 - cl(t), 3),
  out5: t => 1 - Math.pow(1 - cl(t), 5),
  inout: t => { t = cl(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
  in: t => cl(t) ** 3,
  back: (t, s = 1.7) => { t = cl(t) - 1; return t * t * ((s + 1) * t + s) + 1; },
};
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.domElement.id = 'gl';

renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const scene = new THREE.Scene();
scene.environment = envTex;
const cam = new THREE.PerspectiveCamera(35, W / H, 0.05, 400);
const out = document.getElementById('out');

// ---------------------------------------------------------------- textures
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  t.userData = { c, g, draw };
  return t;
}
function redraw(tex, ...args) { const { c, g, draw } = tex.userData; g.clearRect(0, 0, c.width, c.height); draw(g, c.width, c.height, ...args); tex.needsUpdate = true; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function font(px, w = 700, fam = 'Osw') { return `${w} ${px}px ${fam}`; }
const IMG = {};
function loadImg(k, src) { return new Promise(res => { const i = new Image(); i.onload = () => { IMG[k] = i; res(); }; i.src = src; }); }

const ICONS = {
  phone(g, x, y, s, col) { g.strokeStyle = col; g.lineWidth = s * 0.06; rr(g, x - s * .3, y - s * .5, s * .6, s, s * .1); g.stroke(); g.beginPath(); g.arc(x - s * .12, y - s * .35, s * .07, 0, 7); g.stroke(); g.beginPath(); g.arc(x + s * .06, y - s * .35, s * .07, 0, 7); g.stroke(); },
  car(g, x, y, s, col) { g.strokeStyle = col; g.lineWidth = s * .06; rr(g, x - s * .5, y - s * .05, s, s * .3, s * .08); g.stroke(); g.beginPath(); g.moveTo(x - s * .3, y - s * .05); g.lineTo(x - s * .18, y - s * .3); g.lineTo(x + s * .2, y - s * .3); g.lineTo(x + s * .32, y - s * .05); g.stroke(); for (const o of [-.28, .28]) { g.beginPath(); g.arc(x + o * s, y + s * .27, s * .1, 0, 7); g.stroke(); } },
  tool(g, x, y, s, col) { g.strokeStyle = col; g.lineWidth = s * .1; g.beginPath(); g.moveTo(x - s * .35, y + s * .35); g.lineTo(x + s * .1, y - s * .1); g.stroke(); g.lineWidth = s * .07; g.beginPath(); g.arc(x + s * .2, y - s * .2, s * .17, 0.6, 5.6); g.stroke(); },
  console(g, x, y, s, col) { g.strokeStyle = col; g.lineWidth = s * .06; rr(g, x - s * .5, y - s * .22, s, s * .48, s * .2); g.stroke(); g.beginPath(); g.moveTo(x - s * .32, y); g.lineTo(x - s * .12, y); g.moveTo(x - s * .22, y - s * .1); g.lineTo(x - s * .22, y + s * .1); g.stroke(); g.fillStyle = col; g.beginPath(); g.arc(x + s * .22, y, s * .06, 0, 7); g.fill(); },
  tv(g, x, y, s, col) { g.strokeStyle = col; g.lineWidth = s * .06; rr(g, x - s * .5, y - s * .32, s, s * .56, s * .05); g.stroke(); g.beginPath(); g.moveTo(x - s * .2, y + s * .38); g.lineTo(x + s * .2, y + s * .38); g.stroke(); },
};

function listingDraw(item, hl) {
  return (g, w, h) => {
    rr(g, 4, 4, w - 8, h - 8, 34); g.fillStyle = hl ? '#1f2a14' : CSS.panel; g.fill();
    g.lineWidth = hl ? 10 : 4; g.strokeStyle = hl ? CSS.yel : '#2a3a50'; g.stroke();
    rr(g, 30, 30, h - 60, h - 60, 24); g.fillStyle = CSS.panel2; g.fill();
    ICONS[item.icon](g, 30 + (h - 60) / 2, h / 2, (h - 60) * .62, hl ? CSS.yel : '#9aa6b8');
    const tx = h + 10;
    g.fillStyle = CSS.paper; g.font = font(54, 500); g.textBaseline = 'alphabetic'; g.fillText(item.title, tx, 96);
    g.fillStyle = hl ? CSS.yel : CSS.paper; g.font = font(92, 700); g.fillText(item.price, tx, 200);
    g.fillStyle = CSS.grey; g.font = font(34, 500, 'Mono'); g.fillText(item.city, tx, h - 44);
  };
}

  { icon: 'car', title: 'Kia Rio 2017', price: '820 000 ₽', city: 'Казань · 5 мин' },

  { icon: 'tool', title: 'Шуруповёрт DeWalt', price: '7 900 ₽', city: 'Тюмень · 6 мин' },

// ---------------------------------------------------------------- materials / builders
const M = {
  dark: new THREE.MeshStandardMaterial({ color: 0x141c28, roughness: .8 }),
  wall: new THREE.MeshStandardMaterial({ color: 0x1a2232, roughness: .95 }),
  floor: new THREE.MeshStandardMaterial({ color: 0x0f141c, roughness: .6, metalness: .1 }),
  wood: new THREE.MeshStandardMaterial({ color: 0x2a2018, roughness: .7 }),
  fabric: new THREE.MeshStandardMaterial({ color: 0x2b3a58, roughness: 1 }),
  fabric2: new THREE.MeshStandardMaterial({ color: 0x3d4c6c, roughness: 1 }),
  phoneBody: new THREE.MeshStandardMaterial({ color: 0x24262c, roughness: .35, metalness: .8 }),
  titanium: new THREE.MeshStandardMaterial({ color: 0x8c8780, roughness: .32, metalness: .95 }),
  glassBlack: new THREE.MeshStandardMaterial({ color: 0x050608, roughness: .05, metalness: .3 }),
  yelGlow: new THREE.MeshBasicMaterial({ color: C.yel }),
  card: new THREE.MeshStandardMaterial({ color: 0x18222e, roughness: .5, metalness: .2 }),
};
function box(w, h, d, mat, r = 0.02) { const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2, h / 2, d / 2)), mat); m.castShadow = true; m.receiveShadow = true; return m; }
function plane(w, h, map, opts = {}) {
  const mat = opts.basic === false ? new THREE.MeshStandardMaterial({ map, transparent: true, roughness: .6 })
    : new THREE.MeshBasicMaterial({ map, transparent: true, depthWrite: opts.depthWrite ?? false, toneMapped: false, side: THREE.DoubleSide, blending: opts.add ? THREE.AdditiveBlending : THREE.NormalBlending });
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
}
function textTex(lines, o = {}) {
  // lines: [{t, size, w, col, fam}]
  const w = o.w || 1024, h = o.h || 256;
  return canvasTex(w, h, (g) => {
    let y = o.pad ?? 0;
    const total = lines.reduce((s, l) => s + l.size * (l.lh || 1.1), 0);
    y = (h - total) / 2;
    for (const l of lines) {
      g.font = font(l.size, l.w ?? 700, l.fam || 'Osw'); g.fillStyle = l.col || CSS.paper; g.textAlign = o.align || 'center'; g.textBaseline = 'top';
      if (o.shadow) { g.shadowColor = o.shadow; g.shadowBlur = 40; }
      g.fillText(l.t, o.align === 'left' ? 20 : w / 2, y);
      y += l.size * (l.lh || 1.1);
    }
  });
}
function glowSprite(color, size, op = 1) {
  const t = canvasTex(256, 256, (g) => { const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, color, blending: THREE.AdditiveBlending, transparent: true, opacity: op, depthWrite: false, toneMapped: false }));
  s.scale.set(size, size, 1); return s;
}
function makePhone(screenTex, w = 0.76) {
  const h = w * 2.05, g = new THREE.Group();
  const body = box(w, h, 0.085, M.phoneBody, 0.1); g.add(body);
  const scr = new THREE.Mesh(new RoundedBoxGeometry(w * 0.93, h * 0.955, 0.01, 3, 0.085), new THREE.MeshBasicMaterial({ map: screenTex, toneMapped: false }));
  scr.position.z = 0.044; g.add(scr);
  const isl = box(w * .3, w * .085, 0.005, new THREE.MeshBasicMaterial({ color: 0x000000 }), 0.04); isl.position.set(0, h * .44, 0.05); g.add(isl);
  g.userData.screen = scr; g.userData.h = h;
  return g;
}
function phoneScreen(draw) { return canvasTex(720, 1480, (g, w, h, ...a) => { g.fillStyle = '#070a10'; g.fillRect(0, 0, w, h); draw(g, w, h, ...a); }); }

function notifDraw(g, w, h, k = 1, time = '07:00') {
  g.fillStyle = CSS.paper; g.textAlign = 'center'; g.font = font(190, 300); g.fillText(time, w / 2, 360);
  g.font = font(40, 400); g.fillStyle = CSS.grey; g.fillText('понедельник, 4 ноября', w / 2, 430);
  if (k <= 0) return;
  const y = 520, x = 36, ww = w - 72;
  g.globalAlpha = cl(k * 2);
  rr(g, x, y, ww, 330, 48); g.fillStyle = 'rgba(52,56,68,.95)'; g.fill();
  g.save(); g.beginPath(); g.arc(x + 82, y + 82, 50, 0, 7); g.fillStyle = CSS.yel; g.fill(); g.clip();
  if (IMG.face) g.drawImage(IMG.face, x + 22, y + 22, 120, 120); g.restore();
  g.textAlign = 'left'; g.fillStyle = CSS.grey; g.font = font(34, 500); g.fillText('ПЕРЕКУПЫ · нейросеть', x + 160, y + 70);
  g.fillStyle = CSS.paper; g.font = font(52, 700); g.fillText('Нашла выгодную сделку', x + 160, y + 128);
  g.fillStyle = CSS.yel; g.font = font(40, 600); g.fillText('iPhone 15 Pro — 55 000 ₽', x + 40, y + 212);
  g.fillStyle = CSS.grey; g.font = font(32, 500, 'Mono'); g.fillText('рынок 80 000 ₽ · Казань', x + 40, y + 272);
  g.globalAlpha = 1;
}

// ---------------------------------------------------------------- Russia dot map data
const RU = [[28, 60], [30, 69.5], [40, 67], [44, 68.5], [55, 68.5], [60, 69.5], [68, 72.5], [73, 72], [80, 73.5], [87, 75], [100, 77.5], [113, 73.7], [128, 73], [140, 72.5], [150, 71.5], [160, 69.7], [170, 70], [180, 68.5], [180, 65], [177, 62.5], [163, 60], [160, 54], [156, 51], [155, 57], [142, 59.3], [137, 54], [141, 52], [131, 43], [127, 49.5], [120, 53.3], [108, 49.5], [97, 50], [87, 49.2], [80, 51], [68, 54.5], [61, 51], [55, 51], [48, 47], [47, 42], [40, 43.5], [37, 46.5], [38, 47.5], [40, 49.5], [35, 52], [31, 56], [28, 56.5]];
const CITIES = [['Москва', 37.6, 55.75], ['Санкт-Петербург', 30.3, 59.9], ['Казань', 49.1, 55.8], ['Екатеринбург', 60.6, 56.8], ['Новосибирск', 82.9, 55.0], ['Краснодар', 39.0, 45.0], ['Ростов', 39.7, 47.2], ['Самара', 50.1, 53.2], ['Уфа', 56.0, 54.7], ['Омск', 73.4, 55.0], ['Красноярск', 92.9, 56.0], ['Иркутск', 104.3, 52.3], ['Хабаровск', 135.0, 48.5], ['Владивосток', 131.9, 43.1], ['Якутск', 129.7, 62.0], ['Мурманск', 33.0, 68.9], ['Пермь', 56.2, 58.0], ['Тюмень', 65.5, 57.1]];
const mapXY = (lon, lat) => [(lon - 100) * 0.16, -(lat - 60) * 0.24];
function pip(x, y, poly) { let ins = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi + 1e-9) + xi) ins = !ins; } return ins; }

// ================================================================ SETS
const sets = {};
const QUEUE = [];
function set(name, build) { QUEUE.push([name, build]); }
function buildSets() { for (const [name, build] of QUEUE) { const g = new THREE.Group(); g.visible = false; scene.add(g); sets[name] = { g, ...build(g) }; } }
function lightRig(g, o = {}) {
  const hemi = new THREE.HemisphereLight(o.sky ?? 0x4a6a8a, o.ground ?? 0x05070a, o.hemi ?? 0.5); g.add(hemi);
  const key = new THREE.DirectionalLight(o.key ?? 0xffffff, o.keyI ?? 1.2); key.position.set(...(o.keyPos || [3, 6, 4]));
  if (o.shadow) { key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.camera.left = -6; key.shadow.camera.right = 6; key.shadow.camera.top = 6; key.shadow.camera.bottom = -6; key.shadow.bias = -0.0005; key.shadow.radius = 4; }
  g.add(key); g.add(key.target);
  return { hemi, key };
}

// ---- A: building exterior at dawn
set('building', (g) => {
  lightRig(g, { hemi: .35, keyI: .3, sky: 0x6a7fa8 });
  const skyT = canvasTex(64, 512, (c, w, h) => { const gr = c.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#060a16'); gr.addColorStop(.55, '#1a2240'); gr.addColorStop(.8, '#6a4250'); gr.addColorStop(1, '#c9785a'); c.fillStyle = gr; c.fillRect(0, 0, w, h); });
  const sky = plane(120, 160, skyT); sky.position.set(0, 20, -60); g.add(sky);
  const r = rng(4);
  const winMatOff = new THREE.MeshStandardMaterial({ color: 0x0b1220, roughness: .2, metalness: .5 });
  const winMatOn = new THREE.MeshBasicMaterial({ color: 0xffc070, toneMapped: false });
  const winMatYel = new THREE.MeshBasicMaterial({ color: C.yel, toneMapped: false });
  const facade = box(14, 30, 1, new THREE.MeshStandardMaterial({ color: 0x1b2230, roughness: .9 }), 0.05); facade.position.set(0, 7, -1); g.add(facade);
  let target;
  for (let row = 0; row < 16; row++) for (let col = 0; col < 7; col++) {
    const x = -5.4 + col * 1.8, y = -6 + row * 1.7;
    const hero = row === 6 && col === 3;
    const on = hero || r() < .14;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 1.1), hero ? winMatYel : on ? winMatOn : winMatOff);
    m.position.set(x, y, -0.48); g.add(m);
    const sill = box(1.3, 0.08, 0.25, M.dark, 0.01); sill.position.set(x, y - 0.62, -0.38); g.add(sill);
    if (hero) target = m;
  }
  // neighbouring blocks
  for (const [x, z, h] of [[-14, -10, 22], [13, -12, 26], [-22, -25, 30], [24, -28, 20]]) {
    const b = box(8, h, 6, new THREE.MeshStandardMaterial({ color: 0x0e141e, roughness: .9 }), .05); b.position.set(x, h / 2 - 8, z); g.add(b);
    for (let i = 0; i < 26; i++) { if (r() < .5) continue; const m = new THREE.Mesh(new THREE.PlaneGeometry(.6, .6), r() < .3 ? winMatOn : winMatOff); m.position.set(x - 3 + r() * 6, -6 + r() * (h - 4), z + 3.01); g.add(m); }
  }
  const glow = glowSprite(C.yel, 6, .7); glow.position.copy(target.position).add(new THREE.Vector3(0, 0, .3)); g.add(glow);
  g.fog = new THREE.Fog(0x0a1018, 12, 70);
  return { target, glow };
});

// ---- bedroom (clock, bed, phone)
set('bedroom', (g) => {
  const amb = new THREE.HemisphereLight(0x3a5274, 0x050608, .35); g.add(amb);
  const sun = new THREE.SpotLight(0xffa070, 60, 30, .5, .6, 1.2); sun.position.set(-6, 4, -1); sun.target.position.set(1, 0, 0);
  sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -.0008; g.add(sun); g.add(sun.target);
  const room = new THREE.Group(); g.add(room);
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), M.floor); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; room.add(fl);
  const back = new THREE.Mesh(new THREE.PlaneGeometry(20, 8), M.wall); back.position.set(0, 4, -3); back.receiveShadow = true; room.add(back);
  const left = new THREE.Mesh(new THREE.PlaneGeometry(20, 8), M.wall); left.rotation.y = Math.PI / 2; left.position.set(-3.5, 4, 0); left.receiveShadow = true; room.add(left);
  // window in left wall: frame bars cast shadow (light comes through)
  const winSky = canvasTex(64, 256, (c, w, h) => { const gr = c.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#2a3866'); gr.addColorStop(1, '#ff9a6a'); c.fillStyle = gr; c.fillRect(0, 0, w, h); });
  const win = plane(2.2, 2.2, winSky); win.rotation.y = Math.PI / 2; win.position.set(-3.49, 2.6, 0.2); room.add(win);
  left.material = M.wall;
  for (const z of [-0.9, 0.2, 1.3]) { const bar = box(.12, 2.4, .12, M.dark, .01); bar.position.set(-3.4, 2.6, z); room.add(bar); }
  for (const y of [1.5, 2.6, 3.7]) { const bar = box(.12, .12, 2.3, M.dark, .01); bar.position.set(-3.4, y, 0.2); room.add(bar); }
  // bed
  const bed = new THREE.Group(); room.add(bed);
  const frame = box(2.4, .45, 3.4, M.wood, .05); frame.position.set(0, .25, 0); bed.add(frame);
  const head = box(2.5, 1.3, .15, M.wood, .05); head.position.set(0, .8, -1.75); bed.add(head);
  const mat = box(2.3, .3, 3.2, new THREE.MeshStandardMaterial({ color: 0xc8ccd6, roughness: 1 }), .12); mat.position.set(0, .6, 0); bed.add(mat);
  const pillow = box(1.1, .22, .55, M.fabric2, .1); pillow.position.set(-.4, .85, -1.25); bed.add(pillow);
  const headS = new THREE.Mesh(new THREE.SphereGeometry(.26, 24, 16), new THREE.MeshStandardMaterial({ color: 0x2a1e18, roughness: .9 })); headS.position.set(-.35, 1.0, -1.15); headS.castShadow = true; bed.add(headS);
  const blanket = box(2.36, .32, 2.5, M.fabric, .16); blanket.position.set(0, .82, .35); bed.add(blanket);
  const lump = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), M.fabric); lump.scale.set(.5, .22, 1.0); lump.position.set(-.35, .95, .1); lump.castShadow = true; bed.add(lump);
  // nightstand
  const ns = box(.8, .7, .6, M.wood, .04); ns.position.set(1.75, .35, -1.3); room.add(ns);
  // digital clock
  const clockTex = canvasTex(512, 220, (c, w, h, txt = '06:59') => { c.fillStyle = '#0b0605'; c.fillRect(0, 0, w, h); c.font = font(170, 800, 'Mono'); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#2a120c'; c.fillText('88:88', w / 2, h / 2 + 6); c.fillStyle = CSS.org; c.shadowColor = CSS.org; c.shadowBlur = 30; c.fillText(txt, w / 2, h / 2 + 6); });
  const clock = new THREE.Group(); room.add(clock);
  const cbody = box(.5, .24, .16, new THREE.MeshStandardMaterial({ color: 0x111111, roughness: .3 }), .04); clock.add(cbody);
